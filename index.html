<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>熔岩夺宝抽奖模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
.stage{position:absolute;top:50%;left:50%;width:2340px;height:1080px;margin:-540px 0 0 -1170px;transform-origin:center center;cursor:pointer}
.layer{position:absolute;inset:0;width:2340px;height:1080px;pointer-events:none;user-select:none;-webkit-user-drag:none;display:block}
.layer-bg{z-index:1}
.layer-weapon{z-index:2;animation:weaponFloat 4s ease-in-out infinite;will-change:transform;filter:drop-shadow(0 0 25px rgba(100,140,255,.3))}
@keyframes weaponFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
/* 奖池选择模式下武器浮动幅度减小 */
.layer-weapon.weapon-small{
  animation: weaponFloatSmall 4s ease-in-out infinite;
}
@keyframes weaponFloatSmall{
  0%,100%{transform: translateY(0);}
  50%{transform: translateY(-10px);}
}
.btn-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
/* 奖池选择模式 - 金色光晕 */
.gold-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,0.55) 0%,rgba(255,215,0,0.25) 40%,rgba(255,215,0,0) 70%);pointer-events:none;animation:glowPulse 1.5s ease-in-out infinite;z-index:5}
@keyframes glowPulse{0%,100%{opacity:0.8;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
/* 奖池选择模式 - 热区层 */
.pool-select-hit-layer{position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;z-index:20;pointer-events:auto}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:10px;transition:transform .12s ease,background .12s ease}
.hotspot:active{transform:scale(.93);background:rgba(255,215,0,.12)}
.hotspot.pulse{animation:btnPulse 2s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,50,.5)}50%{box-shadow:0 0 0 18px rgba(255,200,50,0)}}
.ripple{position:absolute;border-radius:50%;border:3px solid rgba(255,200,50,.9);background:radial-gradient(circle,rgba(255,220,100,.25) 0%,rgba(255,180,0,.08) 60%,transparent 100%);transform:translate(-50%,-50%) scale(0);animation:rippleExpand .7s cubic-bezier(.1,.8,.3,1) forwards;pointer-events:none;z-index:100;box-shadow:0 0 24px rgba(255,200,50,.5),0 0 48px rgba(255,180,0,.25)}
@keyframes rippleExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(7);opacity:0}}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:100}
.flash{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,210,.9) 0%,rgba(255,220,100,.35) 40%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:flashBurst .55s ease-out forwards;pointer-events:none;z-index:99}
@keyframes flashBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.6);opacity:.7}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.shockwave{position:absolute;border-radius:50%;border:2px solid rgba(255,230,120,.6);transform:translate(-50%,-50%) scale(0);animation:shockwaveExpand .8s ease-out forwards;pointer-events:none;z-index:98}
@keyframes shockwaveExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:.8}100%{transform:translate(-50%,-50%) scale(10);opacity:0}}

.hotspot,
.hotspot:active,
.hotspot:hover,
.hotspot:focus,
.hotspot.pulse,
.hotspot.selected{
  border:none!important;
  background:transparent!important;
  outline:none!important;
  box-shadow:none!important;
  animation:none!important;
}
.hotspot-label{display:none!important}

.exchange-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:center;justify-content:center}
.exchange-modal.active{display:flex}
.exchange-box{position:relative;width:92%;height:88%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.8)}
.exchange-box iframe{width:100%;height:100%;border:none;display:block;background:#000}

.fs-btn{position:fixed;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid rgba(var(--primary-color-rgb),.5);color:var(--primary-color);font-size:26px;cursor:pointer;z-index:10000000;display:flex;align-items:center;justify-content:center;transition:all .2s}

/* 背景音乐音量调节（垂直） */
.bgm-volume-control{position:fixed;top:72px;right:12px;width:32px;height:120px;background:rgba(0,0,0,.65);border:1px solid rgba(var(--primary-color-rgb),.4);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 0;z-index:10000000;transition:all .2s}
.bgm-volume-control:hover{background:rgba(0,0,0,.8);border-color:rgba(var(--primary-color-rgb),.7)}
.bgm-volume-icon{font-size:14px;margin-bottom:6px;flex-shrink:0}
.bgm-volume-slider{-webkit-appearance:none;appearance:none;width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer;transform:rotate(-90deg);transform-origin:center center;margin-top:30px}
.bgm-volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary-color);cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(var(--primary-color-rgb),.6)}
.bgm-volume-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ffd700;cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(255,215,0,.6)}
/* 全屏时隐藏全屏按钮和音量调节 */
:fullscreen .fs-btn, :fullscreen .bgm-volume-control,
:-webkit-full-screen .fs-btn, :-webkit-full-screen .bgm-volume-control{display:none !important}
/* 页面说明文字 */
.page-info{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#ccc;font-size:12px;line-height:1.5;padding:6px 20px;z-index:10000000;text-align:left}
.disclaimer-box{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#999;font-size:12px;line-height:1.6;padding:10px 20px;z-index:10000000;text-align:left;border-top:1px solid rgba(255,255,255,0.1)}
.page-info .title{color:var(--primary-color);font-size:13px;font-weight:bold;margin-bottom:2px}
.page-info .guide{margin-bottom:2px}
.page-info .guide p{margin:0}
.page-info .disclaimer{color:#999;font-size:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px}
.fs-btn:hover{background:rgba(255,215,0,.2);transform:scale(1.1)}
.fs-btn:active{transform:scale(.92)}
body.is-fullscreen .fs-btn{display:none!important}
body.is-fullscreen .page-info{display:none!important}
body.is-fullscreen .disclaimer-box{display:none!important}

<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  /* 熔岩夺宝橙红色主题 */
  --primary-color: #ff6b35;
  --primary-color-rgb: 255,107,53;
  --primary-color-light: #ff8c5a;
  --accent-color: #ff3b30;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

/* ===== 加载页面样式（熔岩夺宝橙红色主题） ===== */
#loadingOverlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#000;
  z-index:9999;
  transition:opacity 0.5s ease;
}
#loadingOverlay.hidden{
  opacity:0;
  pointer-events:none;
}
/* 加载界面容器（和模拟器stage一样，2340x1080，自适应缩放居中） */
#loadingStage{
  position:absolute;
  top:0;
  left:0;
  width:2340px;
  height:1080px;
  transform-origin:top left;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0a0a1a;
  overflow:hidden;
}
/* 首页背景图模糊层 */
.loading-bg{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:url('images/common/pages/home/pool_select_bg.png') center/cover no-repeat;
  filter:blur(12px) brightness(0.5);
  transform:scale(1.1);
  z-index:0;
  pointer-events:none;
}
/* 背景网格线效果（橙红色） */
#loadingStage::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:
    linear-gradient(rgba(var(--primary-color-rgb),0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(var(--primary-color-rgb),0.06) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:1;
}
/* 旋转光晕效果（橙红色） */
#loadingStage::after{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle,rgba(var(--primary-color-rgb),0.1) 0%,transparent 50%);
  animation:rotateGlow 15s linear infinite;
  pointer-events:none;
  z-index:1;
}

.loading-bar-container{

/* 进度条填充（橙红色渐变） */
.loading-bar-fill{
  height:100%;
  width:0%;

  box-shadow:0 0 15px rgba(var(--primary-color-rgb),0.6);

  content:'';

  top:0;left:0;right:0;bottom:0;

    90deg,
    transparent 0px,
    transparent 20px,

/* 环形加载动画容器 */
.loading-spinner-container{

/* 环形背景 */

}
/* 环形进度（旋转动画） */
.loading-spinner{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;

  border-top-color:var(--primary-color);
  border-right-color:var(--primary-color-light);

}
@keyframes spin{

/* 环形中心光点 */

  transform:translate(-50%,-50%);
  width:40px;
  height:40px;

  border-radius:50%;
  box-shadow:0 0 15px rgba(var(--primary-color-rgb),0.8);

}
@keyframes pulse{

}
@keyframes glowDot{

function getItemImage(itemName, type) {
  if (!itemName) return '';
  type = type || 'small';
  
  // 从ITEM_BOX_CONFIG中获取道具配置
  var config = window.ITEM_BOX_CONFIG ? window.ITEM_BOX_CONFIG[itemName] : null;
  if (!config) {
    // 兜底：尝试直接拼接路径
    return '../images/items_box/' + itemName + '/' + type + '.png';
  }
  
  // 如果请求showcase但道具没有showcase，返回small
  if (type === 'showcase' && !config.has_showcase) {
    return '../images/items_box/' + itemName + '/small.png';
  }
  
  // 如果请求small但道具有showcase，返回showcase（复用）
  if (type === 'small' && config.has_showcase) {
    return '../images/items_box/' + itemName + '/showcase.png';
  }
  
  return '../images/items_box/' + itemName + '/' + type + '.png';
}

var preloadLoadedCount = 0;
var preloadTotalCount = PRELOAD_RESOURCES.length;
var preloadFinished = false;

function onPreloadResourceLoaded(path) {
  preloadLoadedCount++;
  var percent = Math.min(100, (preloadLoadedCount / preloadTotalCount) * 100);
  var progressBar = document.getElementById('loadingBarFill');
  var progressText = document.getElementById('loadingPercent');
  var stageText = document.getElementById('loadingStageText');
  
  if (progressBar) progressBar.style.width = percent + '%';
  if (progressText) progressText.textContent = Math.floor(percent) + '%';
  if (stageText) {
    if (percent < 30) stageText.textContent = '正在加载图片资源···';
    else if (percent < 70) stageText.textContent = '正在加载音效资源···';
    else if (percent < 100) stageText.textContent = '正在初始化模拟器···';
    else stageText.textContent = '加载完成！';
  }
  
  if (preloadLoadedCount >= preloadTotalCount && !preloadFinished) {
    preloadFinished = true;
    setTimeout(function() {
      var loadingOverlay = document.getElementById('loadingOverlay');
      if (loadingOverlay) {
        loadingOverlay.classList.add('hidden');
        setTimeout(function() {
          loadingOverlay.style.display = 'none';
        }, 500);
      }
    }, 300);
  }
}

function preloadResources() {
  for (var i = 0; i < PRELOAD_RESOURCES.length; i++) {
    (function(path) {
      var ext = path.split('.').pop().toLowerCase();
      if (ext === 'm4a' || ext === 'mp3' || ext === 'wav') {
        var audio = new Audio();
        audio.onloadeddata = function() { onPreloadResourceLoaded(path); };
        audio.onerror = function() { onPreloadResourceLoaded(path); };
        audio.src = path;
      } else {
        var img = new Image();
        img.onload = function() { onPreloadResourceLoaded(path); };
        img.onerror = function() { onPreloadResourceLoaded(path); };
        img.src = path;
      }
    })(PRELOAD_RESOURCES[i]);
  }
}

// ========== 奖池选择模式 - 金色光晕 ==========
function showPoolSelectGoldGlow(poolId){
  var glow = document.getElementById('poolSelectGoldGlow');
  var center = POOL_SELECT_WEAPON_CENTERS[poolId];
  if(!glow || !center) return;
  var r = center.r * 1.3;
  glow.style.width = (r * 2) + 'px';
  glow.style.height = (r * 2) + 'px';
  glow.style.left = (center.x - r) + 'px';
  glow.style.top = (center.y - r) + 'px';
  glow.style.display = 'block';
}
function hidePoolSelectGoldGlow(){
  var glow = document.getElementById('poolSelectGoldGlow');
  if(glow) glow.style.display = 'none';
}

// ========== 奖池选择模式 - 获取点击位置对应的武器 ==========
function getPoolSelectWeaponAtPosition(x, y){
  var nearestPool = null;
  var nearestDist = Infinity;
  for (var poolId in POOL_SELECT_WEAPON_CENTERS){
    var center = POOL_SELECT_WEAPON_CENTERS[poolId];
    var dist = Math.sqrt((x - center.x) * (x - center.x) + (y - center.y) * (y - center.y));
    if (dist < center.r && dist < nearestDist){
      nearestDist = dist;
      nearestPool = poolId;
    }
  }
  return nearestPool;
}

// ========== 奖池选择模式 - 坐标转换 ==========
function getPoolSelectStageCoords(e){
  var stage = document.getElementById('stage');
  if(!stage) return {x:0, y:0};
  var rect = stage.getBoundingClientRect();
  var scaleX = 2340 / rect.width;
  var scaleY = 1080 / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

// ========== 奖池选择模式 - 进入/退出 ==========
function enterPoolSelectMode(){
  var bg = document.getElementById('homeBg');
  var weapon = document.getElementById('weaponFloat');
  var transition = document.getElementById('transitionModal');
  
  // 显示转接页面，避免切换过程中黑屏或闪烁
  if(transition){
    if(typeof layoutTransition === 'function') layoutTransition();
    transition.classList.add('show');
  }
  
  // 预加载奖池选择页面的背景图和武器图
  var newBg = new Image();
  var newWeapon = new Image();
  var loaded = 0;
  var total = 2;
  function checkComplete(){
    loaded++;
    if(loaded >= total){
      // 替换背景和武器
      if(bg && POOL_BG_MAP['pool_select']) bg.src = POOL_BG_MAP['pool_select'];
      if(weapon && POOL_WEAPON_MAP['pool_select']) weapon.src = POOL_WEAPON_MAP['pool_select'];
      
      // 奖池选择模式下武器图缩小
      if(weapon) weapon.classList.add('weapon-small');
      
      // 显示金色光晕和热区层
      document.getElementById('poolSelectGoldGlow').style.display = 'none';
      document.getElementById('poolSelectHitLayer').style.display = 'block';
      
      // 隐藏按钮层（禁用所有原有按钮）
      document.getElementById('btnLayer').style.display = 'none';
      
      // 重置选中状态
      poolSelectSelectedPool = null;
      
      // 设置标志位
      isPoolSelectMode = true;
      
      // 延迟一小段时间再隐藏转接页面，确保渲染完成
      setTimeout(function(){
        if(transition) transition.classList.remove('show');
      }, 100);
    }
  }
  newBg.onload = checkComplete;
  newBg.onerror = checkComplete;
  newWeapon.onload = checkComplete;
  newWeapon.onerror = checkComplete;
  newBg.src = POOL_BG_MAP['pool_select'];
  newWeapon.src = POOL_WEAPON_MAP['pool_select'];
}

function exitPoolSelectMode(poolId){
  // 切换到选中的奖池
  switchPool(poolId);
  
  // 恢复武器图大小
  var weapon = document.getElementById('weaponFloat');
  if(weapon) weapon.classList.remove('weapon-small');
  
  // 隐藏金色光晕和热区层
  document.getElementById('poolSelectGoldGlow').style.display = 'none';
  document.getElementById('poolSelectHitLayer').style.display = 'none';
  
  // 显示按钮层
  document.getElementById('btnLayer').style.display = 'block';
  
  // 设置标志位
  isPoolSelectMode = false;
}

// ========== 奖池选择模式 - 点击处理 ==========
function initPoolSelectHitLayer(){
  var hitLayer = document.getElementById('poolSelectHitLayer');
  if(!hitLayer) return;
  hitLayer.addEventListener('click', function(e){
    var pos = getPoolSelectStageCoords(e);
    
    // 先检查是否点了确定按钮
    if (pos.x >= POOL_SELECT_CONFIRM_BTN.x && pos.x <= POOL_SELECT_CONFIRM_BTN.x + POOL_SELECT_CONFIRM_BTN.w &&
        pos.y >= POOL_SELECT_CONFIRM_BTN.y && pos.y <= POOL_SELECT_CONFIRM_BTN.y + POOL_SELECT_CONFIRM_BTN.h){
      if (poolSelectSelectedPool){
        playBackSound(); // 确定按钮成功执行后播放back音效
        exitPoolSelectMode(poolSelectSelectedPool);
      }
      return;
    }
    
    // 检查是否点了武器
    var poolId = getPoolSelectWeaponAtPosition(pos.x, pos.y);
    if (poolId){
      playClickSound(); // 选中池子时播放点击音效
      poolSelectSelectedPool = poolId;
      showPoolSelectGoldGlow(poolId);
    }
  });
}
// 页面加载完成后初始化
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initPoolSelectHitLayer);
}else{

}

// 转接页面横屏缩放（和选择页/仓库一致）
function layoutTransition(){
  var stage = document.getElementById('transitionStage');
  if(!stage) return;
  var sw = window.innerWidth, sh = window.innerHeight;
  var s = Math.min(sw/2340, sh/1080);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = (sw - 2340*s)/2 + 'px';
  stage.style.top = (sh - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layoutTransition);
layoutTransition();

function openPoolSelect(){

  enterPoolSelectMode();

  if(isPoolSelectMode){

function switchPool(poolId){
  // pool_select是特殊模式，不是真正的奖池，不允许通过switchPool切换
  if(poolId === 'pool_select') return;
  if(!POOL_BG_MAP[poolId] || !POOL_WEAPON_MAP[poolId]) return;
  currentPool = poolId;
  // 切换抽奖概率表（来自gacha_base.js的7个奖池配置）
  if(window.GACHA_POOLS && window.GACHA_POOLS[poolId]){
    window.CURRENT_POOL = poolId;
    window.GACHA_BASE_POOL = window.GACHA_POOLS[poolId];
  }
  var homeBg = document.getElementById('homeBg');
  var weaponFloat = document.getElementById('weaponFloat');
  var transition = document.getElementById('transitionModal');
  
  // 显示转接页面，避免切换过程中黑屏或闪烁
  if(transition){
    if(typeof layoutTransition === 'function') layoutTransition();
    transition.classList.add('show');
  }
  
  // 等两张新图片都加载完成后再替换，避免闪烁
  var newBg = new Image();
  var newWeapon = new Image();
  var loaded = 0;
  var total = 2;
  function checkComplete(){
    loaded++;
    if(loaded >= total){
      if(homeBg) homeBg.src = POOL_BG_MAP[poolId];
      if(weaponFloat) weaponFloat.src = POOL_WEAPON_MAP[poolId];
      // 图片替换完成后，延迟一小段时间再隐藏转接页面，确保渲染完成
      setTimeout(function(){
        if(transition) transition.classList.remove('show');
      }, 100);
    }
  }
  newBg.onload = checkComplete;
  newBg.onerror = checkComplete;
  newWeapon.onload = checkComplete;
  newWeapon.onerror = checkComplete;
  newBg.src = POOL_BG_MAP[poolId];
  newWeapon.src = POOL_WEAPON_MAP[poolId];
}

// 初始化音效对象池
for(var i = 0; i < AUDIO_POOL_SIZE; i++){
  var ac = new Audio('audio/gacha/click.m4a');
  ac.preload = 'auto';
  audioClickPool.push(ac);
  
  var ao = new Audio('audio/buy/close.m4a');
  ao.preload = 'auto';
  audioClosePool.push(ao);
  
  // 打开音效（兑换商城/暂存箱/奖励一览）
  var aopen = new Audio('audio/ui/open.m4a');
  aopen.preload = 'auto';
  audioOpenPool.push(aopen);
  
  // 返回音效（返回键）
  var aback = new Audio('audio/ui/back.m4a');
  aback.preload = 'auto';
  audioBackPool.push(aback);
  
  // 仓库打开音效
  var awh = new Audio('audio/warehouse/open.m4a');
  awh.preload = 'auto';
  audioWarehouseOpenPool.push(awh);
  
  // 暂存箱返回键音效
  var asb = new Audio('audio/storage/back.m4a');
  asb.preload = 'auto';
  audioStorageBackPool.push(asb);
  
  // 恭喜获得页面音效
  var ar = new Audio('audio/gacha/reward.m4a');
  ar.preload = 'auto';
  audioRewardPool.push(ar);
}

// 页面加载后解锁音频（解决浏览器自动播放策略）
document.addEventListener('click', function unlockAudio(){
  try{
    audioClickPool[0].play().then(function(){
      audioClickPool[0].pause();
      audioClickPool[0].currentTime = 0;
    }).catch(function(e){});
  }catch(e){}
  document.removeEventListener('click', unlockAudio);
}, {once: true});

    bgmAudio.currentTime = 0;
    bgmAudio.play().catch(function(e){});
  }catch(e){}
}

// 从指定概率池中抽奖
function drawFromPool(pool){
  var totalWeight = 0;
  for(var i = 0; i < pool.length; i++){
    totalWeight += pool[i].weight;
  }
  var random = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < pool.length; i++){
    cumulative += pool[i].weight;
    if(random < cumulative){
      return pool[i];
    }
  }
  return pool[pool.length - 1];
}

  var itemsToAdd = warehouseConfirmedItems.slice();
  itemsToAdd.forEach(function(newItem){
    // 熔岩兑换币和紫电兑换币不放入仓库（熔岩兑换币在addToStorage里已计数，紫电兑换币在addToStorage里已计数）
    if(newItem.name && (newItem.name.indexOf('熔岩兑换币') !== -1 || newItem.name.indexOf('紫电兑换币') !== -1)){
      return;
    }
    var existing = warehouseItems.find(function(x){ return x.name === newItem.name; });
    if(existing){
      existing.count = (existing.count || 1) + (newItem.count || 1);
    }else{
      warehouseItems.push(newItem);
    }
  });
  
  // 从暂存箱扣除道具（支持count>1的情况）
  var itemsToDeduct = {};
  itemsToAdd.forEach(function(item){
    if(!itemsToDeduct[item.name]){
      itemsToDeduct[item.name] = 0;
    }
    itemsToDeduct[item.name] += (item.count || 1);
  });
  
  for(var deductName in itemsToDeduct){
    var countToDeduct = itemsToDeduct[deductName];
    for(var j = storageItems.length - 1; j >= 0; j--){
      if(storageItems[j].name === deductName){
        if(storageItems[j].count && storageItems[j].count > countToDeduct){
          storageItems[j].count -= countToDeduct;
        }else{
          storageItems.splice(j, 1);
        }
        break;
      }
    }
  }
  
  // 重置状态
  pendingWarehouseItems = [];
  warehouseAllItems = [];
  warehouseCurrentBatch = 0;
  warehouseTotalBatches = 0;
  warehouseConfirmedItems = [];
  
  // 通知暂存箱页面更新
  setTimeout(function(){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'sendToWarehouseSuccess', items: storageItems}, '*');
    }
  }, 50);
  
  // 最后关闭多道具显示页面
  setTimeout(function(){
    var multiModal = document.getElementById('warehouseMultiModal');
    if(multiModal) multiModal.classList.remove('show');
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe){
      multiIframe.onload = null;
      setTimeout(function(){
        multiIframe.src = 'about:blank';
      }, 200);
    }
  }, 100);
  
  // 不关闭暂存箱，让用户可以继续操作
}

// 熔岩夺宝：禁用额外加赠（保留代码，不触发）
var enableBonus = false;

// 检查是否满足额外加赠条件（每满十次，包括单抽和十连抽）
function checkBonusEligibility(){
  // 熔岩夺宝：禁用额外加赠
  if(!enableBonus) return;
  // 检查从上一次触发到现在，是否跨过了任何10的倍数
  var lastMultiple = Math.floor(lastBonusDrawCount / 10) * 10; // 上一次触发时或之前的最近10的倍数
  var currentMultiple = Math.floor(totalDrawCount / 10) * 10; // 当前次数或之前的最近10的倍数
  if(currentMultiple > lastMultiple && currentMultiple > 0){
    bonusPending = true;
    lastBonusDrawCount = currentMultiple; // 更新上一次触发额外加赠的次数为最近的10的倍数
    // 特殊奖池二选一：A池和B池各抽一个
    bonusRewardA = drawFromPool(BONUS_POOL_A);
    bonusRewardB = drawFromPool(BONUS_POOL_B);
    // 立刻显示额外加赠提示页面（特殊奖池二选一）
    openBonusTip();
  }
}

// 进行概率抽奖，获得额外加赠的奖励
function drawBonusReward(){
  var totalWeight = 0;
  for(var i = 0; i < BONUS_ITEM_POOL.length; i++){
    totalWeight += BONUS_ITEM_POOL[i].weight;
  }
  var random = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < BONUS_ITEM_POOL.length; i++){
    cumulative += BONUS_ITEM_POOL[i].weight;
    if(random < cumulative){

// 检查是否满足神话加赠条件（每满50次）
function checkMythicEligibility(){
  // 熔岩夺宝：禁用神话加赠
  if(!enableMythicBonus) return;
  // 检查从上一次触发到现在，是否跨过了任何50的倍数
  var lastMultiple = Math.floor(lastMythicDrawCount / 50) * 50;
  var currentMultiple = Math.floor(totalDrawCount / 50) * 50;
  if(currentMultiple > lastMultiple && currentMultiple > 0){
    mythicPending = true;
    lastMythicDrawCount = currentMultiple;
    // 立刻显示神话加赠提示页面
    openMythicTip();
  }
}

// 进行概率抽奖，获得神话加赠的奖励
function drawMythicReward(){
  var totalWeight = 0;
  for(var i = 0; i < MYTHIC_ITEM_POOL.length; i++){
    totalWeight += MYTHIC_ITEM_POOL[i].weight;
  }
  var random = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < MYTHIC_ITEM_POOL.length; i++){
    cumulative += MYTHIC_ITEM_POOL[i].weight;
    if(random < cumulative){
      return MYTHIC_ITEM_POOL[i];
    }
  }
  return MYTHIC_ITEM_POOL[MYTHIC_ITEM_POOL.length - 1];
}

window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'gachaClose'){
    // 把获得的奖励存入暂存箱（熔岩兑换币计数在confirmSendToWarehouse里统一处理，避免重复）
    if(e.data.rewards && e.data.rewards.length > 0){
      for(var i = 0; i < e.data.rewards.length; i++){
        addToStorage(e.data.rewards[i]);
      }
    }
  }
  if(e.data && e.data.type === 'closeReward') closeReward();
  if(e.data && e.data.type === 'closeStorage') closeStorage();
  if(e.data && e.data.type === 'closeWarehouse') closeWarehouse();
  if(e.data && e.data.type === 'warehouseMultiConfirm'){ confirmSendToWarehouse(); }
  if(e.data && e.data.type === 'requestWarehouseItems'){
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe && multiIframe.contentWindow){
      multiIframe.contentWindow.postMessage({type:'setWarehouseItems', items: pendingWarehouseItems}, '*');
    }
  }
  if(e.data && e.data.type === 'sendToWarehouse'){
    var itemsToSend = e.data.items || [];
    // 显示发放仓库恭喜获得页面
    showSendToWarehouseReward(itemsToSend);
  }
  if(e.data && e.data.type === 'closeDecomposeReward') closeDecomposeReward();
  if(e.data && e.data.type === 'bonusTipConfirm') closeBonusTip(e.data.selectedReward);
  if(e.data && e.data.type === 'bonusRewardConfirm') closeBonusReward();
  if(e.data && e.data.type === 'mythicTipConfirm') closeMythicTip();
  if(e.data && e.data.type === 'mythicRewardConfirm') closeMythicReward();
  if(e.data && e.data.type === 'requestPoints'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'updatePoints', points: pointsCount}, '*');
    }
    var exchangeIframe = document.getElementById('exchangeIframe');
    if(exchangeIframe && exchangeIframe.contentWindow){
      exchangeIframe.contentWindow.postMessage({type:'updatePoints', points: pointsCount}, '*');
    }
  }
  if(e.data && e.data.type === 'requestZidianPoints'){
    var exchangeIframe = document.getElementById('exchangeIframe');
    if(exchangeIframe && exchangeIframe.contentWindow){
      exchangeIframe.contentWindow.postMessage({type:'updateZidianPoints', points: zidianPointsCount}, '*');
    }
  }
  // 兑换商城同步紫电兑换币计数（以兑换商城为准）
  if(e.data && e.data.type === 'syncZidianPoints'){
    zidianPointsCount = e.data.points || 0;
    updateZidianPointsDisplay();
  }
  if(e.data && e.data.type === 'requestStorageData'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'storageData', items: storageItems, points: pointsCount}, '*');
    }
  }
  if(e.data && e.data.type === 'decomposeItems'){
    var points = e.data.points || 0;
    var items = e.data.items || [];
    // 加到首页积分
    if(points > 0){
      pointsCount += points;
      updatePointsDisplay();
    }
    // 从暂存箱中删除已分解的道具
    for(var i = 0; i < items.length; i++){
      for(var j = storageItems.length - 1; j >= 0; j--){
        if(storageItems[j].name === items[i].name){
          storageItems.splice(j, 1);
          break;
        }
      }
    }
    // 显示恭喜获得页面（复用购买成功弹窗样式）
    if(points > 0){
      showDecomposeRewardNew(points);
    }
    // 重新发送数据给暂存箱页面
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'decomposeSuccess', items: storageItems, points: pointsCount}, '*');
    }
  }
  if(e.data === 'closeGachaSingle'){
    closeGachaSingle();
  }else if(e.data === 'closeGachaTen'){
    closeGachaTen();
  }else if(e.data && e.data.type === 'gachaClose'){
    // 根据当前抽奖类型调用对应的关闭函数，避免同时调用两个导致竞态
    if(currentGachaType === 'single'){
      closeGachaSingle();
    }else if(currentGachaType === 'ten'){
      closeGachaTen();
    }
  }
  if(e.data && e.data.type === 'closeExchange'){
    playBackSound(); // 播放返回音效
    document.getElementById('exchangeModal').classList.remove('active');
  }
  if(e.data && e.data.type === 'closeRecharge') closeRecharge();
  if(e.data && e.data.type === 'requestCfmCoin'){
    updateCfmCoinDisplay();
  }
  if(e.data && e.data.type === 'openPayment'){
    openPayment(e.data.tier);
  }
  if(e.data && e.data.type === 'closePayment'){
    closePayment();
  }
  if(e.data && e.data.type === 'openExchangeConfirm'){
    openExchangeConfirm(e.data.product, e.data.price, e.data.qty, e.data.cat);
  }
  if(e.data && e.data.type === 'closeExchangeConfirm'){
    closeExchangeConfirm();
  }
  if(e.data && e.data.type === 'exchangeConfirm'){
    // 执行兑换逻辑
    doExchange();
  }
  if(e.data && e.data.type === 'paymentSuccess'){
    var tierCoinsList = [3, 6, 30, 68, 128, 198, 328, 648];
    var coins = tierCoinsList[currentPaymentTier] || 1296;
    cfmCoinCount += coins;
    updateCfmCoinDisplay();
    // 不关闭弹窗，等用户点击成功提示页面后再关闭
  }
  if(e.data && e.data.type === 'tryBuy'){
    // 直接打开二次确认页面，CFM币检查放在确认购买后
    currentBuyTier = parseInt(e.data.tier) || 0;
    openConfirm();
  }
  if(e.data && e.data.type === 'openConfirm'){
    currentBuyTier = parseInt(e.data.tier) || 0;
    openConfirm();
  }
  if(e.data && e.data.type === 'closeBuySuccess'){
    closeBuySuccess();
  }
  if(e.data && e.data.type === 'closeZidianSerial'){
    closeZidianSerial();
  }
  if(e.data && e.data.type === 'closeConfirm'){
    closeConfirm();
    if(e.data.action === 'confirm'){
      var tierCoins = [1, 10, 66, 135];
      var tierPrices = [6, 50, 328, 648];
      var addCoins = tierCoins[currentBuyTier] || 1;
      var costCoins = tierPrices[currentBuyTier] || 6;
      if(cfmCoinCount < costCoins){
        // CFM不够，关闭购买页面并打开充值页面
        setTimeout(function(){ closeShop(); openRecharge(); }, 100);
      } else {
        // CFM足够，扣除CFM币并增加抽奖币
        gachaCoinCount += addCoins;
        cfmCoinCount -= costCoins;
        updateGachaCoinDisplay();
        updateCfmCoinDisplay();
        // 显示恭喜获得弹窗
        setTimeout(function(){ showBuySuccess(addCoins); }, 200);
      }
    }
  }
});
</script>

<script>
var shopTpl = document.getElementById('shopTpl').value;

/* ===== 购买：完全独立 ===== */
function openShop(){
  var iframe = document.getElementById('shopIframe');
  var modal = document.getElementById('shopModal');
  // 先清空iframe，避免多次打开累积内容导致黑屏
  iframe.srcdoc = '';
  iframe.onload = function(){
    // 只有当srcdoc是shopTpl时才显示，避免清空时触发onload
    if(iframe.srcdoc && iframe.srcdoc.length > 100){
      modal.className = 'shop-modal shop-show';
    }
  };
  // 延迟设置srcdoc，确保先清空
  setTimeout(function(){
    iframe.srcdoc = shopTpl;
  }, 10);
  // 超时保护，确保一定能显示
  setTimeout(function(){
    if(!modal.classList.contains('shop-show')){
      modal.className = 'shop-modal shop-show';
    }
  }, 500);
}
function closeShop(){
  // 关闭音效已在shopTpl的关闭按钮click事件中播放（零帧起手），这里不再重复播放
  var modal = document.getElementById('shopModal');
  var iframe = document.getElementById('shopIframe');
  modal.className = 'shop-modal';
  // 延迟清空iframe，确保隐藏动画完成后再清空
  setTimeout(function(){
    iframe.srcdoc = '';
  }, 300);
}
/* ===== 充值弹窗：完全独立 ===== */
function openRecharge(){
  playOpenSound(); // 播放打开音效
  var modal = document.getElementById('rechargeModal');
  var iframe = document.getElementById('rechargeIframe');
  iframe.onload = function(){
    modal.className = 'recharge-modal recharge-show';
  };
  iframe.src = 'pages/recharge.html?t=' + Date.now();
  setTimeout(function(){
    if(!modal.classList.contains('recharge-show')){
      modal.className = 'recharge-modal recharge-show';
    }
  }, 300);
}
function closeRecharge(){
  playBackSound(); // 播放关闭音效
  document.getElementById('rechargeModal').className = 'recharge-modal';
}
/* ===== 二次确认弹窗：完全独立 ===== */
function openConfirm(){
  var modal = document.getElementById('confirmModal');
  var iframe = document.getElementById('confirmIframe');
  var loaded = false;
  iframe.onload = function(){
    loaded = true;
    modal.className = 'confirm-modal confirm-show';

/* ===== 兑换成功弹窗：完全独立 ===== */
/* ===== 数量选择弹窗 ===== */
let numSelectTarget = {product:'', price:0, cat:'', max:99, now:1};

// 强制让兑换商城iframe获得焦点，修复点击无响应的问题
function focusExchangeIframe(){
  try{
    var exchangeIframe = document.getElementById('exchangeIframe');
    if(exchangeIframe){
      exchangeIframe.focus();
      // 延迟一点再让iframe里的body获得焦点
      setTimeout(function(){
        try{
          exchangeIframe.contentWindow.focus();
          exchangeIframe.contentDocument.body.focus();
        }catch(e){}
      }, 50);
    }
  }catch(e){}
}

// 打开数量选择弹窗
function openNumSelect(product, price, cat, max){
  numSelectTarget = {product:product, price:price, cat:cat, max:max||99, now:1};
  document.getElementById('numSelectTitle').textContent = '兑换【' + product + '】';
  document.getElementById('numValue').textContent = '1';
  document.getElementById('numSelectMask').classList.add('show');
}

// 绑定数量选择弹窗事件
function bindNumSelect(){
  // 减
  document.getElementById('numMinus').onclick = function(){
    if(numSelectTarget.now > 1){
      numSelectTarget.now--;
      document.getElementById('numValue').textContent = numSelectTarget.now;
    }
  };
  // 加
  document.getElementById('numPlus').onclick = function(){
    if(numSelectTarget.now < numSelectTarget.max){
      numSelectTarget.now++;
      document.getElementById('numValue').textContent = numSelectTarget.now;
    }
  };
  // 取消
  document.getElementById('numCancel').onclick = function(){
    document.getElementById('numSelectMask').classList.remove('show');
    // 强制让兑换商城iframe获得焦点，修复点击无响应的问题
    focusExchangeIframe();
  };
  // 确认
  document.getElementById('numConfirm').onclick = function(){
    var target = numSelectTarget;
    document.getElementById('numSelectMask').classList.remove('show');
    // 延迟一点再显示兑换确认弹窗，确保数量选择弹窗完全关闭
    setTimeout(function(){
      openExchangeConfirmInternal(target.product, target.price, target.now, target.cat);
    }, 150);
  };
}

// 兑换确认弹窗内部函数（不经过数量选择）
function openExchangeConfirmInternal(product, price, qty, cat){
  // 保存当前兑换信息
  currentExchangeProduct = product || '';
  currentExchangePrice = price || 0;
  currentExchangeQty = qty || 1;
  currentExchangeCat = cat || 'm4';
  
  var modal = document.getElementById('exchangeConfirmModal');
  var iframe = document.getElementById('exchangeConfirmIframe');
  var loaded = false;
  iframe.onload = function(){
    loaded = true;
    iframe.contentWindow.postMessage({
      type: 'setExchangeInfo',
      product: currentExchangeProduct,
      price: currentExchangePrice,
      qty: currentExchangeQty,
      cat: currentExchangeCat
    }, '*');
    modal.className = 'exchange-confirm-modal exchange-confirm-show';
  };
  iframe.src = 'pages/exchange_confirm.html?t=' + Date.now();
  setTimeout(function(){
    if(!loaded){
      modal.className = 'exchange-confirm-modal exchange-confirm-show';
    }
  }, 800);
}

function openExchangeConfirm(product, price, qty, cat){
  // 如果是紫电兑换币，先弹出数量选择
  var isZidianCoin = (product && product.indexOf('紫电兑换币') !== -1);
  if(isZidianCoin){
    // 计算最大可兑换数量（根据当前熔岩兑换币数量）
    var maxCount = 99;
    if(price > 0){
      maxCount = Math.floor(pointsCount / price);
      if(maxCount < 1) maxCount = 1;
      if(maxCount > 99) maxCount = 99;
    }
    openNumSelect(product, price, cat, maxCount);
    return;
  }
  // 其他道具直接打开兑换确认
  openExchangeConfirmInternal(product, price, qty, cat);
}
function closeExchangeConfirm(){
  document.getElementById('exchangeConfirmModal').className = 'exchange-confirm-modal';
  var iframe = document.getElementById('exchangeConfirmIframe');
  iframe.onload = null;
  iframe.src = 'about:blank';
  // 强制让兑换商城iframe获得焦点，修复点击无响应的问题
  focusExchangeIframe();
}

// 显示兑换失败弹窗
function showExchangeFail(title, msg){
  var mask = document.getElementById('exchangeFailMask');
  if(mask){
    document.getElementById('exchangeFailTitle').textContent = title || '兑换失败';
    document.getElementById('exchangeFailMsg').textContent = msg || '兑换币不足';
    mask.style.display = 'flex';
  }
}

// 关闭兑换失败弹窗
function closeExchangeFail(){
  var mask = document.getElementById('exchangeFailMask');
  if(mask) mask.style.display = 'none';
}



// 执行兑换逻辑
function doExchange(){
  if(!currentExchangeProduct){
    closeExchangeConfirm();
    return;
  }
  
  var totalCost = currentExchangePrice * currentExchangeQty;
  var isZidianCat = (currentExchangeCat === 'zidian');
  
  // 根据分类决定扣除哪种兑换币
  if(isZidianCat){
    // 紫电熔岩分类：扣除紫电兑换币
    if(zidianPointsCount < totalCost){
      showExchangeFail('兑换失败', '需要' + totalCost + '紫电兑换币，当前只有' + zidianPointsCount + '紫电兑换币');
      closeExchangeConfirm();
      return;
    }
    zidianPointsCount -= totalCost;
    updateZidianPointsDisplay();
    // 通知兑换商城页面更新紫电币数量显示
    var exchangeIframe = document.getElementById('exchangeIframe');
    if(exchangeIframe && exchangeIframe.contentWindow){
      exchangeIframe.contentWindow.postMessage({type:'updateZidianPoints', points: zidianPointsCount}, '*');
    }
  }else{
    // 其他分类：扣除熔岩兑换币
    if(pointsCount < totalCost){
      showExchangeFail('兑换失败', '需要' + totalCost + '熔岩兑换币，当前只有' + pointsCount + '熔岩兑换币');
      closeExchangeConfirm();
      return;
    }
    pointsCount -= totalCost;
    updatePointsDisplay();
  }
  
  // 获取道具信息
  var itemInfo = findExchangeItem(currentExchangeProduct);
  
  // 判断是否是兑换紫电兑换币（不发仓库，直接增加计数）
  var isZidianCoinExchange = (currentExchangeProduct && currentExchangeProduct.indexOf('紫电兑换币') !== -1);
  
  if(isZidianCoinExchange){
    // 兑换紫电兑换币：通知兑换商城增加计数（以兑换商城为准），首页等待同步
    var exchangeIframe = document.getElementById('exchangeIframe');
    if(exchangeIframe && exchangeIframe.contentWindow){
      exchangeIframe.contentWindow.postMessage({type:'addZidianPoints', count: currentExchangeQty}, '*');
    }
    // 关闭兑换确认弹窗
    closeExchangeConfirm();
    // 显示恭喜获得页面
    var coinItem = {
      name: '紫电兑换币',
      count: currentExchangeQty,
      quality: 'purple',
      image: itemInfo.image || 'images/items_box/紫电兑换币/small.png',
      showcase: false
    };
    showSendToWarehouseReward([coinItem]);
    return;
  }
  
  // 构造道具对象
  var item = {
    name: itemInfo.name || currentExchangeProduct,
    count: currentExchangeQty,
    quality: itemInfo.quality,
    image: itemInfo.image,
    showcase: itemInfo.showcase || false
  };
  
  // 关闭兑换确认弹窗
  closeExchangeConfirm();
  
  // 显示恭喜获得页面（参考暂存箱发放仓库单个道具的代码）
  showSendToWarehouseReward([item]);
}

/* ===== 监听postMessage ===== */
window.addEventListener('message', function(e){
  if(e.data === 'closeShop') closeShop();
});
</script>
