<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>确认购买</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:2912px;height:1344px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hotspot{position:absolute;cursor:pointer;z-index:10;background:transparent;border:none;outline:none}
.hotspot:active{background:rgba(255,215,0,0.15)}

/* 禁止长按查看图片/保存图片 */
img{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
/* 禁止全局右键菜单 */
*{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-img" src="../images/common/pages/buy/confirm_bg.png" alt="确认购买">
  <!-- 取消按钮 -->
  <button class="hotspot" id="cancelBtn" style="left:980px;top:960px;width:380px;height:130px"></button>
  <!-- 确认购买按钮 -->
  <button class="hotspot" id="confirmBtn" style="left:1520px;top:960px;width:380px;height:130px"></button>
</div>

<script>

// ===== 点击音效 =====
var clickAudioPool = [];
var clickAudioIndex = 0;
for(var i = 0; i < 5; i++){
  var ca = new Audio('../audio/gacha/click.m4a');
  ca.preload = 'auto';
  clickAudioPool.push(ca);
}
function playClickSound(){
  try{
    var audio = clickAudioPool[clickAudioIndex];
    clickAudioIndex = (clickAudioIndex + 1) % 5;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 点击音效结束 =====

// ===== 音频解锁：用户第一次点击时重新加载所有音频 =====
var audioUnlocked = false;
document.addEventListener('click', function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  // 重新加载所有点击音效
  for(var i = 0; i < clickAudioPool.length; i++){
    try{
      clickAudioPool[i].load();
    }catch(e){}
  }
  console.log('音频已解锁');
}, {once: true});
// ===== 音频解锁结束 =====



// ===== 操作确定按钮音效（购买确定/分解/发送仓库）=====
var actionConfirmAudioPool = [];
var actionConfirmAudioIndex = 0;
for(var i = 0; i < 3; i++){
  var aca = new Audio('../audio/ui/action_confirm.m4a');
  aca.preload = 'auto';
  actionConfirmAudioPool.push(aca);
}
function playActionConfirmSound(){
  try{
    var audio = actionConfirmAudioPool[actionConfirmAudioIndex];
    actionConfirmAudioIndex = (actionConfirmAudioIndex + 1) % 3;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 操作确定按钮音效结束 =====

// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2912, window.innerHeight/1344);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2912*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1344*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// 取消按钮：关闭弹窗
document.getElementById('cancelBtn').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  setTimeout(function(){
    window.parent.postMessage({type:'closeConfirm', action:'cancel'}, '*');
  }, 80);
});

// 确认购买按钮：关闭弹窗并执行购买
document.getElementById('confirmBtn').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  setTimeout(function(){
    window.parent.postMessage({type:'closeConfirm', action:'confirm'}, '*');
  }, 80);
});
</script>

<script>
// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
