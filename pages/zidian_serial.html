<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫电熔岩获得编号</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
    .stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
    .bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none;display:block}
    /* 编号显示（雷霆字样右边） */
    .serial-num{
      position:absolute;
      left:1145px;
      top:176px;
      font-size:64px;
      font-weight:bold;
      color:#FFFFFF;
      text-shadow:0 0 20px rgba(255,255,255,0.6), 0 2px 4px rgba(0,0,0,0.9);
      z-index:10;
      letter-spacing:4px;
    }
    /* 道具大图（中间） */
    .item-showcase{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:1400px;
      height:1000px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10;
    }
    .item-showcase img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      filter:drop-shadow(0 0 40px rgba(255,215,0,0.6));
      animation:itemPopIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, itemFloat 3s ease-in-out 0.8s infinite;
      opacity:0;
      transform:scale(0);
    }
    @keyframes itemPopIn{
      0%{transform:scale(0);opacity:0}
      60%{transform:scale(1.15);opacity:1}
      100%{transform:scale(1);opacity:1}
    }
    @keyframes itemFloat{
      0%,100%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-15px) scale(1)}
    }
    /* 确定按钮（透明热区） */
    .confirm-hitbox{
      position:absolute;
      bottom:80px;
      left:50%;
      transform:translateX(-50%);
      width:400px;
      height:120px;
      cursor:pointer;
      z-index:20;
      opacity:0;
    }
    .confirm-hitbox:hover{opacity:0.1;background:#fff;border-radius:10px}
  </style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-img" src="../images/common/pages/gacha/zidian_serial_bg.png" draggable="false">
  <div class="serial-num" id="serialNum">000000</div>
  <div class="item-showcase" id="itemShowcase">
    <img id="itemImage" src="" alt="道具">
  </div>
  <div class="confirm-hitbox" id="confirmHitbox"></div>
</div>

<script>
  // 自适应缩放
  function layout(){
    var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
    var stage = document.getElementById('stage');
    stage.style.transform = 'scale('+s+')';
    stage.style.left = (window.innerWidth - 2340*s)/2 + 'px';
    stage.style.top = (window.innerHeight - 1080*s)/2 + 'px';
  }
  window.addEventListener('resize', layout);
  layout();

  var currentItem = null;

  // 生成随机编号（1-100000，补零到6位）
  function generateSerial(){
    var num = Math.floor(Math.random() * 100000) + 1;
    return String(num).padStart(6, '0');
  }

  // 监听父页面的postMessage
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'setZidianSerial'){
      currentItem = e.data.item;
      // 设置道具图片
      var itemImage = document.getElementById('itemImage');
      if(e.data.image){
        itemImage.src = e.data.image;
      }
      // 生成并显示随机编号
      document.getElementById('serialNum').textContent = generateSerial();
    }
  });

  // 确定按钮点击
  document.getElementById('confirmHitbox').addEventListener('click', function(){
    // 播放确定音效
    try{
      var audio = new Audio('../audio/gacha/confirm.m4a');
      audio.volume = 0.5;
      audio.play();
    }catch(e){}
    // 通知父页面关闭
    window.parent.postMessage({type:'closeZidianSerial'}, '*');
  });

  // 键盘ESC也可以关闭
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      window.parent.postMessage({type:'closeZidianSerial'}, '*');
    }
  });
</script>
</body>
</html>
